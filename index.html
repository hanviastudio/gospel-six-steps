<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gospel in Six Stages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Figtree:wght@300;400;500;600&family=Inter:wght@400;500;600;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>

<header class="bar">
  <a class="brand" id="brand" href="index.html"><span class="cur-dot" id="curDot"></span><span id="curText">Church of Jesus</span></a>
  <div class="bar-right">
    <nav class="langs" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="ko" aria-pressed="false">한국어</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
      <button data-lang="es" aria-pressed="false">ES</button>
    </nav>
    <a class="nav-contact" id="navContact" href="mailto:mjcojhan@gmail.com">Contact <span aria-hidden="true">&#8599;</span></a>
  </div>
  <div class="bar-progress" id="prog"></div>
</header>

<nav class="rail" aria-label="Steps"><ol id="rail"></ol></nav>

<!-- full-screen cosmic intro, Osvald-style corner layout -->
<section id="intro">
  <div class="intro-neb"></div>
  <canvas id="stars"></canvas>
  <div class="intro-guides"><span></span><span></span><span></span><span></span></div>
  <div class="intro-vignette"></div>

  <div class="intro-inner">
    <h1 class="intro-title"><span class="rise" id="introTitle">The Gospel in Six Stages</span></h1>
  </div>

  <div class="intro-foot">
    <div class="intro-ov">
      <span class="intro-ov-label" id="introOverviewLabel">Overview</span>
      <p class="intro-ov-text" id="introOverview">A six-stage journey through the gospel — from the unseen spiritual world to the faith that opens the gift.</p>
    </div>
    <button class="intro-scroll" id="introScroll" type="button" aria-label="Scroll down">
      <span id="scrollText">Scroll</span>
      <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5l7 7 7-7"/></svg></span>
    </button>
    <div class="intro-by">Manjong Han <i>//</i> Hanvia Studio</div>
  </div>
</section>

<main id="app"></main>

<footer><div class="wrap" id="foot"></div></footer>

<script src="common.js"></script>
<script>
  G.init({page:"landing"});
  G.cosmos(document.getElementById("stars"));
  (function(){
    var b = document.getElementById("introScroll");
    if(b) b.addEventListener("click", function(){
      var a = document.getElementById("app");
      if(a) a.scrollIntoView({behavior:"smooth"});
    });
  })();
</script>
</body>
</html>
